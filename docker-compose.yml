version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: aicfs_postgres
    environment:
      POSTGRES_USER: aicfs
      POSTGRES_PASSWORD: password
      POSTGRES_DB: aicfs
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aicfs"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: aicfs_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aicfs_backend
    env_file: ./backend/.env
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - /tmp/aicfs_media:/tmp/aicfs_media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aicfs_celery
    env_file: ./backend/.env
    volumes:
      - ./backend:/app
      - /tmp/aicfs_media:/tmp/aicfs_media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      celery -A app.tasks.celery_app worker
      --loglevel=info
      --queues=cpu_queue,gpu_queue
      --concurrency=4

  celery_flower:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aicfs_flower
    env_file: ./backend/.env
    ports:
      - "5555:5555"
    depends_on:
      - redis
    command: celery -A app.tasks.celery_app flower --port=5555

volumes:
  postgres_data:
  redis_data:
